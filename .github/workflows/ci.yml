name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Unit tests
        run: node --test tests/*.test.mjs

      - name: Shell syntax
        run: bash -n scripts/*.sh

      - name: JS syntax
        run: node --check Model.js

      - name: Manifest is valid JSON
        run: node -e 'const m=require("./manifest.json"); if(!m.id||!m.version||!m.entryPoints) process.exit(1)'
